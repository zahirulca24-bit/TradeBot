name: Python Engine Tests

on:
  pull_request:
    paths:
      - 'engine-python/**'
      - '.github/workflows/python-engine-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'engine-python/**'
      - '.github/workflows/python-engine-tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: Python Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine-python/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
